
    

<div class="main-container vanilla-tilt" (mouseenter)="hovering = 'hovering'" (mouseleave)="hovering = 'out'" data-tilt data-tilt-reverse="true" data-tilt-max="5">
    <mat-icon class="passive-icon">{{shown_icon}}</mat-icon>
    
        <div class="interaction-container">
            <div [@slide-text]="hovering" class="whole-container">
                <div class="info-container price-container">
                    <p>{{event.price == 0 ? 'Gratis' : event.price + '€'}}</p>
                </div>
                <div  class="title-container">
                    <p class="title">{{event.name}}</p> 
                </div>
                <div class="fields-container">

                    <div class="info-container">
                        <mat-icon>event</mat-icon>
                        <p class="subtitle">{{date}}</p>
                    </div>
                    
                    <div class="info-container">
                        <mat-icon>location_on</mat-icon>
                        <p class="subtitle">{{event.place}}</p>
                        
                    </div>
                    <div class="info-container">
                        <mat-icon>groups</mat-icon>
                        <p class="subtitle">{{event.target}}</p>
                    </div>
                    <div class="info-container">
                        <mat-icon>book</mat-icon>
                        <p class="subtitle">{{remaining_places}}/{{event.maxPartecipants}}</p>
                        
                    </div>

                    <div class="info-container">
                        <p class="subtitle description">{{event.description}}</p>
                        
                    </div>
                
                </div>
            </div>
            
        

        </div>
        <div [ngSwitch]="request" class="button-container" [class.fadebut]="hovering == 'hovering'"  >
            <mat-icon class="active-simple-icon" (click)="emit_event()">open_in_new</mat-icon>
            <div *ngSwitchCase='"Eventi"'>
                <button class="button2 button3" (click)="join()">Partecipa</button>
            </div>
            <div *ngSwitchCase='"Richieste"'>
                <button class="button2 button3" (click)="accept()">Accetta</button>
                <button class="button2 button3" (click)="reject()">Rifiuta</button>
            </div>
            <div *ngSwitchDefault>evento undefined</div>
            
            <mat-icon *ngif="admin" class="active-simple-icon" (click)="this.delete()">delete</mat-icon>
        </div>
        
        <div class="gradient" [class.fade]="hovering == 'hovering'"  alt="poster"></div>
</div>
